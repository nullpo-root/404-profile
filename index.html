<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Dev Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        .hover-scale {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-scale:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="root" class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Profile Card -->
            <div class="bg-white rounded-2xl card-shadow p-8 mb-6 text-center">
                <!-- Avatar -->
                <div class="mb-6 flex justify-center">
                    <div class="gradient-bg w-32 h-32 rounded-full flex items-center justify-center text-5xl shadow-xl">
                        <i class="fas fa-code text-white"></i>
                    </div>
                </div>

                <!-- Name -->
                <h1 class="text-4xl font-bold text-gray-900 mb-2">404</h1>
                
                <!-- Title -->
                <p class="text-lg font-semibold text-purple-600 mb-4">Developer</p>

                <!-- Bio -->
                <p class="text-gray-600 text-base leading-relaxed">
                    Passionate about building digital solutions and exploring new technologies.
                </p>
            </div>

            <!-- Contact Links -->
            <div class="space-y-4">
                <!-- Email -->
                <a href="mailto:nullpo.root@gmail.com" 
                   class="hover-scale flex items-center justify-center w-full py-4 rounded-lg font-semibold bg-gradient-to-r from-red-500 to-pink-500 text-white">
                    <i class="fas fa-envelope mr-3 text-lg"></i>
                    Email
                </a>

                <!-- GitHub -->
                <a href="https://github.com/nullpo-root" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="hover-scale flex items-center justify-center w-full py-4 rounded-lg font-semibold bg-gradient-to-r from-gray-700 to-gray-900 text-white">
                    <i class="fab fa-github mr-3 text-lg"></i>
                    GitHub
                </a>

                <!-- Telegram -->
                <a href="https://t.me/tpl404" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="hover-scale flex items-center justify-center w-full py-4 rounded-lg font-semibold bg-gradient-to-r from-blue-400 to-blue-600 text-white">
                    <i class="fab fa-telegram mr-3 text-lg"></i>
                    Telegram
                </a>
            </div>

            <!-- Footer -->
            <div class="text-center mt-8 text-gray-500 text-sm">
                <p>© 2026 404 - Dev Profile</p>
            </div>
        </div>
    </div>
</body>
</html>
